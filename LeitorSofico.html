<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor de Boletos - Sofico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 0; 
    background-color: #f4f7f6; 
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-container {
    flex: 1;
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
  }

  h2 { color: #333; text-align: center; margin-bottom: 30px; }

  /* Estilo do Botão Voltar Fixo */
  .btn-voltar {
    position: fixed;
    top: 20px;
    left: 20px;
    background-color: #6c757d;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: background 0.3s;
    z-index: 1000;
  }
  .btn-voltar:hover { background-color: #5a6268; }

  /* Área de Arrastar e Soltar (Refeita para evitar conflitos) */
  .drop-zone { 
    border: 2px dashed #007bff; 
    padding: 40px 20px; 
    text-align: center; 
    margin-bottom: 20px; 
    background: #fff; 
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .drop-zone.dragover {
    background-color: #e9ecef;
    border-color: #0056b3;
    transform: scale(1.02);
  }
  .drop-zone span { font-size: 18px; font-weight: bold; color: #007bff; display: block; margin-bottom: 10px; }
  .drop-zone .dica { font-size: 13px; color: #666; }
  
  /* Input 100% oculto e fora da zona de clique */
  #fileInput { display: none; }

  /* Botão de Copiar */
  .btn-copiar {
    background: #28a745; 
    color: white; 
    border: none; 
    padding: 15px 20px; 
    cursor: pointer; 
    border-radius: 5px; 
    font-size: 16px; 
    width: 100%; 
    font-weight: bold;
    transition: background 0.3s;
    margin-top: 10px;
  }
  .btn-copiar:hover { background: #218838; }
  .btn-copiar:disabled { background: #6c757d; cursor: not-allowed; }

  /* Área de Resultados */
  #output { display: none; margin-bottom: 30px; }
  .status { font-weight: bold; color: #d32f2f; margin-bottom: 15px; font-size: 18px; text-align: center;}
  .result { background: #fff; padding: 15px; border-radius: 5px; border: 1px solid #ddd; margin-bottom: 20px; font-family: monospace; font-size: 13px; max-height: 250px; overflow-y: auto; line-height: 1.6; }
  textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; white-space: pre; overflow-x: scroll; resize: vertical;}
  
  /* Rodapé Exato */
  .footer-version { 
    text-align: center; 
    font-size: 12px; 
    color: #888; 
    background-color: #e9ecef;
    padding: 15px;
    border-top: 1px solid #ddd; 
    width: 100%;
  }
</style>
</head>
<body>

<a href="index.html" class="btn-voltar">⬅ Voltar</a>

<div class="main-container">
  <h2>Leitor de Boletos - Sofico</h2>
  
  <!-- Estrutura de Arrastar isolada do Input -->
  <div class="drop-zone" id="dropZone">
    <span id="dropZoneText">Clique para selecionar ou arraste e solte os documentos aqui</span>
    <div class="dica">Apenas arquivos PDF. Borderôs vão para análise manual e os com falhas vão para o final da lista.</div>
  </div>
  
  <input type="file" id="fileInput" accept=".pdf" multiple>

  <div id="output">
    <div class="status" id="statusText">Processando...</div>
    <h3>1. Resumo Visual:</h3>
    <div class="result" id="previewText"></div>
    <h3>2. Dados Prontos para o Excel:</h3>
    <textarea id="textoBrutoExcel" readonly></textarea>
    
    <button id="copyBtn" class="btn-copiar" disabled>Copiar Linhas para o Excel</button>
  </div>
</div>

<div class="footer-version">
    Versão Estável: 2026-10-08 15:30
</div>
