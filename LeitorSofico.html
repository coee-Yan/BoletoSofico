<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor de Boletos - Sofico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 0; 
    background-color: #f4f7f6; 
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-container {
    flex: 1;
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
  }

  h2 { color: #333; text-align: center; margin-bottom: 30px; }

  /* Botão de Voltar */
  .btn-voltar {
    position: fixed;
    top: 20px;
    left: 20px;
    background-color: #6c757d;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: background 0.3s;
    z-index: 1000;
  }
  .btn-voltar:hover { background-color: #5a6268; }

  /* Drag and Drop Zone */
  .drop-zone { 
    border: 2px dashed #007bff; 
    padding: 40px 20px; 
    text-align: center; 
    margin-bottom: 20px; 
    background: #fff; 
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .drop-zone.dragover {
    background-color: #e9ecef;
    border-color: #0056b3;
    transform: scale(1.02);
  }
  .drop-zone span { font-size: 18px; font-weight: bold; color: #007bff; display: block; margin-bottom: 10px; }
  .drop-zone .dica { font-size: 13px; color: #666; }
  
  #fileInput { display: none; }

  /* Botão de Cópia */
  .btn-copiar {
    background: #28a745; 
    color: white; 
    border: none; 
    padding: 15px 20px; 
    cursor: pointer; 
    border-radius: 5px; 
    font-size: 16px; 
    width: 100%; 
    font-weight: bold;
    transition: background 0.3s;
    margin-top: 10px;
  }
  .btn-copiar:hover { background: #218838; }
  .btn-copiar:disabled { background: #6c757d; cursor: not-allowed; }

  #output { display: none; margin-bottom: 30px; }
  .status { font-weight: bold; color: #d32f2f; margin-bottom: 15px; font-size: 18px; text-align: center;}
  .result { background: #fff; padding: 15px; border-radius: 5px; border: 1px solid #ddd; margin-bottom: 20px; font-family: monospace; font-size: 13px; max-height: 250px; overflow-y: auto; line-height: 1.6; }
  textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; white-space: pre; overflow-x: scroll; resize: vertical;}
  
  .footer-version { 
    text-align: center; 
    font-size: 12px; 
    color: #888; 
    background-color: #e9ecef;
    padding: 15px;
    border-top: 1px solid #ddd; 
    width: 100%;
  }
</style>
</head>
<body>

<a href="index.html" class="btn-voltar">⬅ Voltar</a>

<div class="main-container">
  <h2>Leitor de Boletos - Sofico</h2>
  
  <div class="drop-zone" id="dropZone">
    <span id="dropZoneText">Clique para selecionar ou arraste e solte os documentos aqui</span>
    <div class="dica">Suporta múltiplos ficheiros em simultâneo. Borderôs e falhas vão para o final da lista.</div>
  </div>
  
  <!-- Input para múltiplos ficheiros -->
  <input type="file" id="fileInput" accept=".pdf" multiple>

  <div id="output">
    <div class="status" id="statusText">Processando...</div>
    <h3>1. Resumo Visual:</h3>
    <div class="result" id="previewText"></div>
    <h3>2. Dados Prontos para o Excel:</h3>
    <textarea id="textoBrutoExcel" readonly></textarea>
    
    <button id="copyBtn" class="btn-copiar" disabled>Copiar Linhas para o Excel</button>
  </div>
</div>

<div class="footer-version">
    Versão Final: 2026-10-09
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // Controlos de Drag and Drop
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  dropZone.addEventListener('click', () => fileInput.click());

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, preventDefaults, false);
    document.body.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
  }

  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
  });
  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
  });

  dropZone.addEventListener('drop', (e) => {
    filtrarEProcessar(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', function(e) {
    filtrarEProcessar(this.files);
  });

  function filtrarEProcessar(files) {
    if (!files || files.length === 0) return;
    const arquivosPdf = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.pdf'));

    if (arquivosPdf.length === 0) {
      alert("Nenhum ficheiro PDF válido selecionado.");
      return;
    }

    processarArquivos(arquivosPdf);
    fileInput.value = '';
  }

  function lerArquivoParaBuffer(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = function() { resolve(new Uint8Array(this.result)); };
      reader.readAsArrayBuffer(file);
    });
  }

  async function processarArquivos(files) {
    document.getElementById('output').style.display = 'block';
    document.getElementById('statusText').innerText = `A extrair dados de ${files.length} boleto(s)...`;
    document.getElementById('statusText').style.color = "#d32f2f";
    document.getElementById('previewText').innerHTML = "";
    document.getElementById('textoBrutoExcel').value = "";
    document.getElementById('copyBtn').disabled = true;

    let linhasPerfeitas = [];
    let linhasComFalha = [];
    let htmlPreview = "";

    for (let f = 0; f < files.length; f++) {
      const file = files[f];
      const nomeOriginal = file.name;
      
      try {
        const typedarray = await lerArquivoParaBuffer(file);
        const pdf = await pdfjsLib.getDocument(typedarray).promise;
        let textoCompleto = "";

        for (let i = 1; i <= pdf.numPages; i++) {
          const pagina = await pdf.getPage(i);
          const conteudoTexto = await pagina.getTextContent();
          const textoDaPagina = conteudoTexto.items.map(item => item.str).join(" ");
          textoCompleto += textoDaPagina + "\n";
        }

        const textoUpper = textoCompleto.toUpperCase();
        const nomeUpper = nomeOriginal.toUpperCase();
        
        // BORDERÔS (Vão para o final com as colunas D, I e R preenchidas)
        if (textoUpper.includes("BORDERO COBRANCA") || nomeUpper.includes("BORDERO") || nomeUpper.includes("BORDERÔ")) {
          const colunasBordero = new Array(20).fill("");
          colunasBordero[1] = nomeOriginal; 
          colunasBordero[3] = "Borderô";    
          colunasBordero[8] = "Sim";        
          colunasBordero[17] = "SOFICO";    
          
          linhasComFalha.push(colunasBordero.join("\t"));
          htmlPreview += `<strong style="color:#d9534f;">${f+1}. [BORDERÔ DETECTADO] Arquivo: ${nomeOriginal} (Movido para o fim)</strong><br><hr style="border:0; border-top: 1px solid #eee;">`;
          continue; 
        }
        
        const dados = extrairDadosPorAncoras(textoCompleto, nomeOriginal);

        // FORMATAÇÃO TSV PARA O EXCEL (Variáveis fixas Sim e SOFICO)
        const colunasExcel = new Array(20).fill(""); 
        colunasExcel[1] = dados.condominio;     // Col B
        colunasExcel[2] = dados.unidadeBloco;   // Col C
        colunasExcel[3] = dados.titular;        // Col D
        colunasExcel[5] = dados.totalParcelas;  // Col F
        colunasExcel[6] = dados.dataVencimento; // Col G
        colunasExcel[7] = dados.dataEmissao;    // Col H
        colunasExcel[8] = "Sim";                // Col I
        colunasExcel[17] = "SOFICO";            // Col R
        colunasExcel[19] = dados.valor;         // Col T

        const linhaFormatada = colunasExcel.join("\t");

        // FALHAS OU BOLETOS PERFEITOS
        if (dados.temFalha) {
          linhasComFalha.push(linhaFormatada);
          htmlPreview += `<strong style="color:#e67e22;">${f+1}. [ATENÇÃO - FALHA/N/A] Arquivo: ${nomeOriginal} (Movido para o fim)</strong><br><hr style="border:0; border-top: 1px solid #eee;">`;
        } else {
          linhasPerfeitas.push(linhaFormatada);
          htmlPreview += `<strong>${f+1}.</strong> ${dados.condominio} | ${dados.unidadeBloco} | ${dados.titular} | Parc: ${dados.totalParcelas} | R$ ${dados.valor}<br><hr style="border:0; border-top: 1px solid #eee;">`;
        }
        
      } catch (error) {
        const colunasErro = new Array(20).fill(nomeOriginal);
        colunasErro[8] = "Sim";
        colunasErro[17] = "SOFICO";
        linhasComFalha.push(colunasErro.join("\t"));
        htmlPreview += `<strong style="color:red;">${f+1}. Erro ao ler: ${nomeOriginal} (Movido para o fim)</strong><br><hr style="border:0; border-top: 1px solid #eee;">`;
      }
    }

    const todasAsLinhas = linhasPerfeitas.concat(linhasComFalha);
    document.getElementById('textoBrutoExcel').value = todasAsLinhas.join("\n");
    document.getElementById('previewText').innerHTML = htmlPreview;
    
    document.getElementById('statusText').innerText = "Extração Concluída com Sucesso!";
    document.getElementById('statusText').style.color = "#28a745";
    
    const btnCopy = document.getElementById('copyBtn');
    btnCopy.disabled = false;
    btnCopy.innerText = `Copiar Linhas para o Excel`;
  }

  // --- NÚCLEO LÓGICO ENXUTO ---
  function extrairDadosPorAncoras(texto, nomeArquivo) {
    const txt = texto.replace(/\s+/g, ' ');

    let condominio = "N/A", unidadeBloco = "N/A", titular = "N/A", totalParcelas = "À VISTA";
    let dataVencimento = "N/A", dataEmissao = "N/A", valor = "N/A";
    let temFalha = false;

    // 1. CONDOMÍNIO E UNIDADE (Regra da Guilhotina Única, lendo da Esquerda para a Direita)
    const regexInformativo = /INFORMATIVO\s*(.*?)\s*(?:PAGAMENTO|ACORDO|DESPESAS)/i;
    const matchInfo = txt.match(regexInformativo);
    
    if (matchInfo && matchInfo[1].trim().length > 2) {
      let bruto = matchInfo[1].trim();
      
      // A FACA: Encontra o primeiro traço com números/termos OU diretamente o termo de bloco
      const regexCorte = /([\s\-]+\d{1,4}\s*\-\s*[A-Za-z0-9]+|[\s\-]*\b\d{5,6}\-[\w\d]+\b|[\s\-]+(?:BLBL|LOJA|AP\.?|BLOCO|BL\b|CJ\b|SALA\b|LOTE\b)|\b(?:BLBL|LOJA|BLOCO)\b|RECIBO:)/i;
      const matchCorte = bruto.match(regexCorte);
      
      if (matchCorte) {
         // Lado Esquerdo = Condomínio puro
         condominio = bruto.substring(0, matchCorte.index).trim();
         condominio = condominio.replace(/[\s\-]+$/, ''); // Remove hífen residual no final
         
         // Lado Direito = Unidade (Bl/Ap)
         let sufixo = bruto.substring(matchCorte.index).trim();
         sufixo = sufixo.replace(/RECIBO:[\s\d]+/i, '').trim(); // Deleta a intrusão do recibo
         sufixo = sufixo.replace(/^[\s\-]+/, '').trim(); // Remove hífen/espaços iniciais
         
         if (sufixo !== "") unidadeBloco = sufixo;
      } else {
         condominio = bruto; // Se não encontrou o padrão de corte, o nome é contínuo
      }
    }

    // Fallback restrito de Unidade (Apenas se o cabeçalho acima não continha de todo a unidade)
    if (unidadeBloco === "N/A" || unidadeBloco === "") {
      const regexCodTopo = /\b(\d{5,6}-[\w\d]+)\b/;
      const matchCodTopo = txt.match(regexCodTopo);
      if (matchCodTopo) {
        unidadeBloco = matchCodTopo[1];
      }
    }

    // 2. TITULAR (Trava inegociável na última ocorrência de "Pagador")
    const regexTitular = /Pagador[\s:]+([A-Za-zÀ-ÿ0-9\s\/\?\.\-\&\'\,]+?)(?=\s*\(|\s+RUA\b|\s+AV\b|\s+AVENIDA\b|\s+TRAVESSA\b|\s+LOTEAMENTO\b|\s+ESTRADA\b|\s+ALAMEDA\b|\s+CEP\b|-CPF|-CNPJ)/gi;
    const matchesTitular = [...txt.matchAll(regexTitular)];
    if (matchesTitular.length > 0) {
      let t = matchesTitular[matchesTitular.length - 1][1].trim(); // Foca na Ficha de Compensação (rodapé)
      t = t.replace(/RECIBO DO PAGADOR.*/i, '').trim();
      if (t.length > 2) titular = t;
    }

    // 3. PARCELAS 
    const regexParcela = /PARCELA[:\s]*(\d{1,3})\/(\d{1,3})/i;
    const matchParc = txt.match(regexParcela);
    if (matchParc) {
      let atual = parseInt(matchParc[1]);
      let total = parseInt(matchParc[2]);
      if (atual === 1 && total === 1) {
        totalParcelas = "À VISTA";
      } else {
        totalParcelas = `${atual}/${total}`;
      }
    }

    // 4. DATAS E VALOR (Âncoras fixas)
    const regexVencimento = /(?:Vencimento|Data de Vencimento|Vencimento[:\s]*)\s*(\d{2}\/\d{2}\/\d{4})/i;
    const matchVencimento = txt.match(regexVencimento);
    if (matchVencimento) dataVencimento = matchVencimento[1];

    const regexEmissao = /(?:Data de[ ]?Emissão|Data do Documento|Processamento|Emissão|Data Processamento)[:\s]*(\d{2}\/\d{2}\/\d{4})/i;
    const matchEmissao = txt.match(regexEmissao);
    if (matchEmissao) dataEmissao = matchEmissao[1];

    const regexValor = /(?:Valor do Documento|Valor Cobrado|Valor|Documento)[:\s]*(?:R\$)?\s*([\d\.,]+)/i;
    const matchValor = txt.match(regexValor);
    if (matchValor) valor = matchValor[1];

    // GESTÃO DE FALHAS VITAIS
    if (condominio === "N/A" || condominio.length < 2) { condominio = nomeArquivo; temFalha = true; }
    if (unidadeBloco === "N/A" || unidadeBloco === "") { unidadeBloco = nomeArquivo; temFalha = true; }
    if (titular === "N/A" || titular.length < 2) { titular = nomeArquivo; temFalha = true; }

    return { condominio, unidadeBloco, titular, totalParcelas, dataVencimento, dataEmissao, valor, temFalha };
  }

  // Comportamento do Botão de Copiar
  document.getElementById('copyBtn').addEventListener('click', function() {
    const textarea = document.getElementById('textoBrutoExcel');
    textarea.select();
    textarea.setSelectionRange(0, 99999);
    try {
      document.execCommand('copy');
      const btn = document.getElementById('copyBtn');
      btn.innerText = "✓ Copiado! Cole na Coluna A do Excel.";
      btn.style.background = "#0056b3";
      setTimeout(() => {
        btn.innerText = "Copiar Linhas para o Excel";
        btn.style.background = "#28a745";
      }, 4000);
    } catch (err) {
      alert("A cópia automática falhou. Por favor, copie manualmente da caixa de texto.");
    }
  });
</script>
</body>
</html>
