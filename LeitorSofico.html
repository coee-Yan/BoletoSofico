<style>
  * { box-sizing: border-box; }
  
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 0; 
    background-color: #f4f7f6; 
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-container {
    flex: 1;
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
  }

  h2 { color: #333; text-align: center; margin-bottom: 30px; }

  /* Estilo do Botão Voltar Fixo */
  .btn-voltar {
    position: fixed;
    top: 20px;
    left: 20px;
    background-color: #6c757d;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: background 0.3s;
    z-index: 1000;
  }
  .btn-voltar:hover { background-color: #5a6268; }

  /* Área de Arrastar e Soltar */
  .drop-zone { 
    border: 2px dashed #007bff; 
    padding: 40px 20px; 
    text-align: center; 
    margin-bottom: 20px; 
    background: #fff; 
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .drop-zone.dragover {
    background-color: #e9ecef;
    border-color: #0056b3;
    transform: scale(1.02);
  }
  .drop-zone span { font-size: 18px; font-weight: bold; color: #007bff; display: block; margin-bottom: 10px; }
  .drop-zone .dica { font-size: 13px; color: #666; }
  .drop-zone input[type="file"] { display: none; }

  /* Botão de Copiar */
  .btn-copiar {
    background: #28a745; 
    color: white; 
    border: none; 
    padding: 15px 20px; 
    cursor: pointer; 
    border-radius: 5px; 
    font-size: 16px; 
    width: 100%; 
    font-weight: bold;
    transition: background 0.3s;
    margin-top: 10px;
  }
  .btn-copiar:hover { background: #218838; }
  .btn-copiar:disabled { background: #6c757d; cursor: not-allowed; }

  /* Área de Resultados */
  #output { display: none; margin-bottom: 30px; }
  .status { font-weight: bold; color: #d32f2f; margin-bottom: 15px; font-size: 18px; text-align: center;}
  .result { background: #fff; padding: 15px; border-radius: 5px; border: 1px solid #ddd; margin-bottom: 20px; font-family: monospace; font-size: 13px; max-height: 250px; overflow-y: auto; line-height: 1.6; }
  textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; white-space: pre; overflow-x: scroll; resize: vertical;}
  
  /* Rodapé Exato */
  .footer-version { 
    text-align: center; 
    font-size: 12px; 
    color: #888; 
    background-color: #e9ecef;
    padding: 15px;
    border-top: 1px solid #ddd; 
    width: 100%;
  }
</style>
</head>

    <button id="copyBtn" class="btn-copiar">Copiar Linhas para o Excel</button>
  </div>
</div>

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  // Lógica Drag and Drop com disparo automático
  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    
    if (e.dataTransfer.files.length > 0) {
      const arquivos = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
      processarArquivos(arquivos);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      const arquivos = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
      processarArquivos(arquivos);
    }
  });

  function lerArquivoParaBuffer(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = function() { resolve(new Uint8Array(this.result)); };
      reader.readAsArrayBuffer(file);
    });
  }

  // Função disparada automaticamente ao soltar ou selecionar os arquivos
  async function processarArquivos(files) {
    if (files.length === 0) return;

    document.getElementById('output').style.display = 'block';
    document.getElementById('statusText').innerText = `Lendo e extraindo dados de ${files.length} boleto(s)...`;
    document.getElementById('statusText').style.color = "#d32f2f";
    document.getElementById('previewText').innerHTML = "";
    document.getElementById('textoBrutoExcel').value = "";
    document.getElementById('copyBtn').disabled = true;

    let linhasPerfeitas = [];
    let linhasComFalha = [];
    let htmlPreview = "";

    for (let f = 0; f < files.length; f++) {
      const file = files[f];
      
      try {
        const typedarray = await lerArquivoParaBuffer(file);
        const pdf = await pdfjsLib.getDocument(typedarray).promise;
        let textoCompleto = "";

        for (let i = 1; i <= pdf.numPages; i++) {
          const pagina = await pdf.getPage(i);
          const conteudoTexto = await pagina.getTextContent();
          const textoDaPagina = conteudoTexto.items.map(item => item.str).join(" ");
          textoCompleto += textoDaPagina + "\n";
        }

        const textoUpper = textoCompleto.toUpperCase();
        const nomeUpper = file.name.toUpperCase();
        
        if (textoUpper.includes("BORDERO COBRANCA") || nomeUpper.includes("BORDERO") || nomeUpper.includes("BORDERÔ")) {
          htmlPreview += `<strong style="color:#d9534f;">${f+1}. [BORDERÔ DETECTADO] Arquivo: ${file.name} - Excluído para análise manual.</strong><br><hr style="border:0; border-top: 1px solid #eee;">`;
          continue; 
        }
        
        const dados = extrairDados(textoCompleto, file.name);

        const colunasExcel = new Array(20).fill(""); 
        colunasExcel[1] = dados.condominio;     // Col B
        colunasExcel[2] = dados.unidadeBloco;   // Col C
        colunasExcel[3] = dados.titular;        // Col D
        colunasExcel[5] = dados.totalParcelas;  // Col F
        colunasExcel[6] = dados.dataVencimento; // Col G
        colunasExcel[7] = dados.dataEmissao;    // Col H
        colunasExcel[19] = dados.valor;         // Col T

        const linhaFormatada = colunasExcel.join("\t");

        if (dados.temFalha) {
          linhasComFalha.push(linhaFormatada);
          htmlPreview += `<strong style="color:#e67e22;">${f+1}. [ATENÇÃO - FALHA/N/A] Arquivo: ${file.name} (Movido para o fim)</strong><br><hr style="border:0; border-top: 1px solid #eee;">`;
        } else {
          linhasPerfeitas.push(linhaFormatada);
          htmlPreview += `<strong>${f+1}.</strong> ${dados.condominio} | ${dados.unidadeBloco} | ${dados.titular} | Parc: ${dados.totalParcelas} | R$ ${dados.valor}<br><hr style="border:0; border-top: 1px solid #eee;">`;
        }
        
      } catch (error) {
        htmlPreview += `<strong style="color:red;">${f+1}. Erro ao ler: ${file.name} (Arquivo corrompido ou protegido)</strong><br><hr style="border:0; border-top: 1px solid #eee;">`;
      }
    }

    const todasAsLinhas = linhasPerfeitas.concat(linhasComFalha);
    document.getElementById('textoBrutoExcel').value = todasAsLinhas.join("\n");
    document.getElementById('previewText').innerHTML = htmlPreview;
    
    document.getElementById('statusText').innerText = "Extração Concluída com Sucesso!";
    document.getElementById('statusText').style.color = "#28a745";
    
    const btnCopy = document.getElementById('copyBtn');
    btnCopy.disabled = false;
    btnCopy.innerText = `Copiar Linhas para o Excel`;
  }

  function extrairDados(texto, nomeArquivo) {
    const txt = texto.replace(/\s+/g, ' ');

    let condominio = "N/A", unidadeBloco = "N/A", titular = "N/A", totalParcelas = "1";
    let dataVencimento = "N/A", dataEmissao = "N/A", valor = "N/A";
    let temFalha = false;

    for (let i = 0; i < listaOficialCondominios.length; i++) {
      let condOficial = listaOficialCondominios[i];
      if (txt.toUpperCase().includes(condOficial)) {
        condominio = condOficial;
        break;
      }
    }

    const regexUnidade = /((?:AP\.|AP|BLBL|Unidade|Bloco|Apto|Casa|Lote|Loja|Sala|Sl\.|Galpao|Galpão)\s*[\w\d\-]+(?:\s*(?:AP\.|AP|BL|Bloco)\s*[\w\d]+)?|\b\d{3,4}\s*[-–]\s*BL\s*[\w\d]+)\b/i;
    const matchUnd = txt.match(regexUnidade);
    if (matchUnd) {
      let valUnd = matchUnd[0].trim();
      if (!valUnd.toUpperCase().includes("UNIDADE M")) {
        unidadeBloco = valUnd;
      }
    }

    const regexTitular = /(?:Sacador\/Avalista|Sacado|Pagador|Nome do Pagador)[:\s]*([A-Za-zÀ-ÿ\s]+?)(?:CPF|CNPJ|-|Endereço|Vencimento|Data|INADIMPLÊNCIA)/i;
    const matchTitular = txt.match(regexTitular);
    if (matchTitular) {
      titular = matchTitular[1].trim();
    }

    const regexFallback = /\b\d{1,3}\/(\d{1,3})\b/g;
    let pMatch;
    while ((pMatch = regexFallback.exec(txt)) !== null) {
      let numParc = parseInt(pMatch[1]);
      if (numParc < 1000) { 
        totalParcelas = pMatch[1];
        break;
      }
    }

    const regexVencimento = /(?:Vencimento|Data de Vencimento|Vencimento[:\s]*)\s*(\d{2}\/\d{2}\/\d{4})/i;
    const matchVencimento = txt.match(regexVencimento);
    if (matchVencimento) dataVencimento = matchVencimento[1];

    const regexEmissao = /(?:Data de[ ]?Emissão|Data do Documento|Processamento|Emissão|Data Processamento)[:\s]*(\d{2}\/\d{2}\/\d{4})/i;
    const matchEmissao = txt.match(regexEmissao);
    if (matchEmissao) dataEmissao = matchEmissao[1];

    const regexValor = /(?:Valor do Documento|Valor Cobrado|Valor|Documento)[:\s]*(?:R\$)?\s*([\d\.,]+)/i;
    const matchValor = txt.match(regexValor);
    if (matchValor) valor = matchValor[1];

    if (condominio === "N/A") { condominio = nomeArquivo; temFalha = true; }
    if (unidadeBloco === "N/A") { unidadeBloco = nomeArquivo; temFalha = true; }
    if (titular === "N/A") { titular = nomeArquivo; temFalha = true; }

    return { condominio, unidadeBloco, titular, totalParcelas, dataVencimento, dataEmissao, valor, temFalha };
  }

  document.getElementById('copyBtn').addEventListener('click', function() {
    const textarea = document.getElementById('textoBrutoExcel');
    textarea.select();
    textarea.setSelectionRange(0, 99999);
    try {
      document.execCommand('copy');
      const btn = document.getElementById('copyBtn');
      btn.innerText = "✓ Copiado! Cole na Coluna A do Excel.";
      btn.style.background = "#0056b3";
      setTimeout(() => {
        btn.innerText = "Copiar Linhas para o Excel";
        btn.style.background = "#28a745";
      }, 4000);
    } catch (err) {
      alert("Cópia bloqueada. Copie manualmente da caixa de texto.");
    }
  });
</script>
